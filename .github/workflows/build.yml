name: 새벽봇 빌드

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: exe 빌드 (npm run dist)
        run: npm run dist

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: saebyeokbot-installer
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 태그 푸시일 때만 정식 Release로 exe 배포
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
