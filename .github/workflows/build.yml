name: 새벽봇 빌드

# main 브랜치에 코드를 푸시(업로드)할 때마다 자동으로 새벽봇 exe를 빌드해요.
# 즉, 로컬에서 npm run dist를 직접 실행하지 않아도 GitHub에 파일만 올리면
# GitHub의 서버(Windows 컴퓨터)가 대신 빌드해줘요. "Actions" 탭에서 진행 상황을
# 볼 수 있고, 빌드가 끝나면 그 실행 결과 페이지 맨 아래 "Artifacts"에서도
# 완성된 exe를 내려받을 수 있어요(다만 이건 14일만 보관되고, 받으려면 깃허브
# 로그인이 필요해요).
#
# 그리고 "v1.0.3" 처럼 v로 시작하는 태그를 붙여서 푸시하면, 위 빌드에 더해서
# 그 exe를 저장소의 정식 "Releases" 페이지에도 자동으로 올려줘요. Releases는
# 로그인 없이 exe를 바로 클릭해서 받을 수 있는 정식 다운로드 페이지라, 실제로
# 사람들에게 배포할 때는 이 태그 방식을 쓰면 돼요.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {} # "Actions" 탭에서 버튼을 눌러 수동으로도 실행할 수 있게 함

# Release를 새로 만들려면 이 저장소에 쓰기 권한이 필요해서 명시적으로 허용해둠
# (별도 토큰을 따로 만들 필요 없이, 깃허브가 실행마다 자동으로 발급해주는 토큰을 씀)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: exe 빌드 (npm run dist)
        run: npm run dist

      - name: 빌드 결과물 업로드 (Actions 탭에서 14일간 확인용)
        uses: actions/upload-artifact@v4
        with:
          name: saebyeokbot-installer
          # Setup.exe(설치형)와 포터블 exe만 올림 — .blockmap이나 압축 중간 파일은 제외
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 태그 푸시일 때만 정식 Release로 exe 배포
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
